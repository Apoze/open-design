packages:
  - packages/*
  - apps/*
  - tools/*
  - shells/*
  - e2e

# The published cmdline declarations import commander, but rc.2 only lists it
# as a devDependency. Keep its public types on the version used to build them.
packageExtensions:
  '@deepseek-ai/dsh-cmdline@0.1.1-rc.2':
    dependencies:
      commander: 15.0.0

overrides:
  brace-expansion: 5.0.6
  devalue: 5.8.1
  fast-uri: 3.1.2
  hono: 4.12.19
  ip-address: 10.2.0
  postcss: 8.5.15
  protobufjs: 8.4.0
  qs: 6.15.2
  tmp: 0.2.7
  yaml: 2.9.0

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
